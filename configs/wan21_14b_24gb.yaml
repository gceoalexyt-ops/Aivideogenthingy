# Wan 2.1 14B on a 24 GB card (RTX 3090 / 4090 / 5090): frozen base weights stored in fp8.
# Generate afterwards with `--memory low`.
name: mika-wan21-14b
model:
  base: Wan-AI/Wan2.1-T2V-14B-Diffusers
  precision: bf16
  base_weights: fp8
lora:
  rank: 32
  alpha: 32
data:
  dataset_dir: data/dataset/images
  cache_dir: data/cache
  resolution: 512
train:
  steps: 2500
  learning_rate: 1.0e-4
  warmup_steps: 50
save_every: 250
sample:
  every: 500
  width: 832
  height: 480
  num_frames: 17
  steps: 25
  flow_shift: 3.0
